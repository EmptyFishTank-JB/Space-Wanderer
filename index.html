<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep-Space Terrarium</title>
  <meta name="description" content="A passive observation window into a solitary traveler's life aboard a deep-space vessel.">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; }
    /* The pixel-art feed: a 320×180 framebuffer blitted at whole-number scale. */
    #feed { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; touch-action: none; cursor: default; }
    /* Camera menu and telemetry styles live in src/ui/switcher.js and src/ui/telemetry.js. */
    body.passive, body.passive #feed { cursor: none; }
    .sound-hint { position: fixed; right: 14px; bottom: 10px; font: 10px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em;
      color: rgba(190, 210, 200, 0.4); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
    .sound-hint.shown { opacity: 1; }
    /* Log captions: only while an entry is being written, in the room where it is written. */
    .caption { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: min(64ch, 86vw); text-align: center;
      font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: rgba(206, 224, 214, 0.78); text-shadow: 0 0 6px #000, 0 0 2px #000;
      opacity: 0; transition: opacity 2.2s ease; pointer-events: none; }
    .caption.shown { opacity: 1; transition-duration: 1.4s; }
    .boot-status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em;
      color: rgba(170, 230, 205, 0.6); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; text-align: center; }
    .boot-status.hint { top: auto; bottom: 14vh; }
    .boot-status.shown { opacity: 1; }
    .caption-head { font-size: 10px; letter-spacing: 0.08em; color: rgba(150, 200, 170, 0.55); min-height: 1.2em; }
  </style>
</head>
<body>
  <canvas id="feed" width="320" height="180" aria-label="Observation feed"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
